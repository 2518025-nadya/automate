<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Automate</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <!-- BAGIAN FOTO -->
        <div class="left">
            <div class="overlay">
                <h4>WELCOME TO AUTOMATE</h4>

                <h1>Your Vehicle<br>In Good Hands</h1>

                <p>
                    Masuk untuk melanjutkan layanan kendaraan terbaik untukmu.
                </p>

                <div class="features">
                    <span>♡ Aman & Terpercaya</span>
                    <span>⚙ Layanan Profesional</span>
                    <span>◷ Tersedia 24/7</span>
                </div>
            </div>
        </div>


        <!-- BAGIAN LOGIN -->
        <div class="right">

            <div class="login-box">

                <h2>Login to Automate</h2>

                <p class="welcome">
                    Selamat datang kembali! 👋<br>
                    Masuk untuk melanjutkan layanan.
                </p>

                <form>

                    <label>Email atau Nomor Telepon</label>

                    <input 
                        type="text" 
                        placeholder="Masukkan email atau nomor telepon"
                    >


                    <label>Password</label>

                    <input 
                        type="password" 
                        placeholder="Masukkan password"
                    >


                    <div class="remember">
                        <label>
                            <input type="checkbox">
                            Ingat saya
                        </label>

                        <a href="#">Lupa password?</a>
                    </div>


                    <button type="submit">
                        Login →
                    </button>

                </form>


                <div class="or">
                    <span>atau</span>
                </div>


                <button class="google">
                    G &nbsp; Login dengan Google
                </button>


                <p class="register">
                    Belum punya akun?
                    <a href="#">Register</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
