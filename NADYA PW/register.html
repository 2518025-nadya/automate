<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Automate</title>

    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <div class="register-container">

        <!-- FOTO KIRI -->
        <div class="left">

            <div class="overlay">

                <h4>WELCOME TO AUTOMATE</h4>

                <h1>Mulai Perjalanan<br>Bersama Kami</h1>

                <p>
                    Daftar sekarang untuk menikmati kemudahan
                    layanan kendaraan terbaik.
                </p>

            </div>

        </div>


        <!-- FORM REGISTER -->
        <div class="right">

            <div class="register-box">

                <h2>Create Your Account</h2>

                <p class="subtitle">
                    Isi data diri kamu untuk membuat akun Automate.
                </p>


                <form>

                    <label>Nama Lengkap</label>

                    <input
                        type="text"
                        placeholder="Masukkan nama lengkap"
                    >


                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Masukkan email kamu"
                    >


                    <label>Nomor Telepon</label>

                    <input
                        type="text"
                        placeholder="Masukkan nomor telepon"
                    >


                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Minimal 8 karakter"
                    >


                    <label>Konfirmasi Password</label>

                    <input
                        type="password"
                        placeholder="Masukkan kembali password"
                    >


                    <button type="submit">
                        Daftar &nbsp; →
                    </button>

                </form>


                <p class="login">
                    Sudah punya akun?
                    <a href="login.html">Login</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
